<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Currency Converter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <div class="header">
            <h1>Currency Converter</h1>
            <p>Convert between currencies using current exchange rates.</p>
        </div>

        <section class="converter-card">

            <div class="input-group">
                <label for="amount">Amount</label>
                <input
                    type="number"
                    id="amount"
                    placeholder="Enter amount"
                    min="0"
                >
            </div>

            <div class="currency-section">

                <div class="currency-group">
                    <label for="fromCurrency">From</label>

                    <select id="fromCurrency">
                        <option value="PHP">PHP - Philippine Peso</option>
                        <option value="USD">USD - US Dollar</option>
                        <option value="EUR">EUR - Euro</option>
                        <option value="GBP">GBP - British Pound</option>
                        <option value="JPY">JPY - Japanese Yen</option>
                        <option value="KRW">KRW - South Korean Won</option>
                        <option value="AUD">AUD - Australian Dollar</option>
                        <option value="CAD">CAD - Canadian Dollar</option>
                        <option value="SGD">SGD - Singapore Dollar</option>
                        <option value="CNY">CNY - Chinese Yuan</option>
                    </select>
                </div>

                <button id="swapButton" class="swap-button" title="Swap currencies">
                    ⇄
                </button>

                <div class="currency-group">
                    <label for="toCurrency">To</label>

                    <select id="toCurrency">
                        <option value="USD">USD - US Dollar</option>
                        <option value="PHP">PHP - Philippine Peso</option>
                        <option value="EUR">EUR - Euro</option>
                        <option value="GBP">GBP - British Pound</option>
                        <option value="JPY">JPY - Japanese Yen</option>
                        <option value="KRW">KRW - South Korean Won</option>
                        <option value="AUD">AUD - Australian Dollar</option>
                        <option value="CAD">CAD - Canadian Dollar</option>
                        <option value="SGD">SGD - Singapore Dollar</option>
                        <option value="CNY">CNY - Chinese Yuan</option>
                    </select>
                </div>

            </div>

            <button id="convertButton" class="convert-button">
                Convert
            </button>

            <div class="result-box">

                <p class="result-label">Converted Amount</p>

                <div id="result">
                    Enter an amount and click Convert.
                </div>

            </div>

        </section>

  

    </main>

    <script src="script.js"></script>

</body>
</html>
